<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大肥鱼 · 控制台</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f1f6fa;color:#203649;font:16px/1.6 'Microsoft YaHei',sans-serif}main{max-width:680px;margin:9vh auto;padding:28px}header{margin-bottom:30px}h1{font-size:30px;margin:0}p{color:#64788a;margin:8px 0}.card{background:white;border:1px solid #dae6ef;border-radius:20px;padding:24px;margin:18px 0;box-shadow:0 7px 24px #18344d08}.row{display:flex;align-items:center;justify-content:space-between;gap:20px}h2{font-size:20px;margin:0}button{border:0;border-radius:12px;padding:13px 22px;font:inherit;cursor:pointer;background:#1979ad;color:white;white-space:nowrap}button.off{background:#e8eef3;color:#405565}button:disabled{opacity:.5;cursor:wait}.small{font-size:13px}#state{color:#1979ad}#notice{min-height:30px;color:#a24d25}footer{font-size:13px;color:#768898}a{color:#1979ad}</style>
<main><header><div>🐟 FISH CONTROL</div><h1>大肥鱼控制台</h1><p>两个开关，管好她的小日子。</p><div id="state" role="status">正在连接…</div></header>
<section class="card"><div class="row"><div><h2>大肥鱼是否启动</h2><p id="runHelp">读取状态中</p></div><button id="run" disabled>加载中</button></div><p class="small">停止后不接话、不主动活动；保留账号登录。关闭本页面不会停止她。</p></section>
<section class="card"><div class="row"><div><h2>是否开放聊天</h2><p id="openHelp">读取状态中</p></div><button id="open" disabled>加载中</button></div><p class="small">关闭：仅与你聊天。开启：也回应其他人的 QQ 私信、群内 @、B站私信与评论互动。平台需能正常接收到消息。</p></section>
<div id="notice" role="alert"></div><footer>其他人的聊天与您的私人历史隔离。费用保护仍然有效。<br><span id="budget"></span><br><span id="visibility"></span><br><a href="https://github.com/watashiwakamida/fish-control" target="_blank" rel="noreferrer">程序源码与 AI 接手说明 ↗</a></footer></main>
<script>const token='__CSRF__';let state,busy=false;const $=id=>document.getElementById(id);function draw(s){state=s;$('visibility').textContent=s.commentVisibilityWarning?'B站部分评论有发送回执，但目前公开不可见；请勿重复发送。':'';$('state').textContent=s.starting?'正在启动后台…':!s.runtime?'后台未连接，点击启动可恢复':s.appliedRevision!==s.revision?'设置已保存，正在生效…':s.enabled?'● 大肥鱼正在运行':'○ 大肥鱼已停止';$('run').textContent=s.enabled&&s.runtime?'停止大肥鱼':'启动大肥鱼';$('run').className=s.enabled?'off':'';$('runHelp').textContent=s.enabled?'她可以接话和进行已授权的主动活动':'她正在休息';$('open').textContent=s.open?'关闭开放':'开放聊天';$('open').className=s.open?'off':'';$('openHelp').textContent=s.open?'开放中 · 其他人也能和她聊天':'仅与你聊天';$('run').disabled=busy;$('open').disabled=busy;$('budget').textContent='本机保守费用估算：¥'+Number(s.budget||0).toFixed(3)+'；模型暂停日期：'+s.cutoff;}
async function refresh(){try{const r=await fetch('/api/status');if(!r.ok)throw Error();draw(await r.json());}catch{$('state').textContent='控制服务未连接，请重新双击启动程序';}}
async function change(x){busy=true;draw(state);$('notice').textContent='';try{const r=await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json','X-Fish-Token':token},body:JSON.stringify(x)});const s=await r.json();if(!r.ok)throw Error(s.error);draw(s);}catch(e){$('notice').textContent=e.message;}finally{busy=false;refresh();}}
$('run').onclick=()=>change({enabled:!state.runtime||!state.enabled});$('open').onclick=()=>change({open:!state.open});refresh();setInterval(refresh,2000);</script></html>
